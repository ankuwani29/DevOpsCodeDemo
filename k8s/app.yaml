apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopsdemo
  labels:
    app: devopsdemo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devopsdemo
  template:
    metadata:
      labels:
        app: devopsdemo
    spec:
      containers:
        - name: devopsdemo
          image: ankitwani29/devopsdemo:IMAGE_TAG
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: devopsdemo
spec:
  type: NodePort
  selector:
    app: devopsdemo
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
