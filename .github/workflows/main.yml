name: CI CD for Docker GitHub
on: workflow_dispatch

jobs:
  buildjob:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Compile code
        run: mvn compile

      - name: Test the code
        run: mvn test

      - name: Package the code
        run: mvn package
